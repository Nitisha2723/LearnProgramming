      background: #4cc9f0;
      border-color: #4cc9f0;
      color: #1a1a2e;

    }

    .filter-btn.cat-ds.active { background: #3a86ff; border-color: #3a86ff; color: #fff; }

    .filter-btn.cat-async.active { background: #06d6a0; border-color: #06d6a0; color: #1a1a2e; }

    /* Card scene */
    .card-scene {
      max-width: 720px;
      margin: 0 auto 16px auto;
      height: 340px;
      perspective: 1200px;
      cursor: pointer;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;

      -webkit-backface-visibility: hidden;

      border-radius: 18px;
      border: 1px solid #0f3460;
      padding: 30px;
      display: flex;
      flex-direction: column;

    .card-front {
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      overflow-y: auto;
    }
    .card-back::-webkit-scrollbar { width: 5px; }
    .card-back::-webkit-scrollbar-track { background: #0f3460; border-radius: 10px; }
    .card-back::-webkit-scrollbar-thumb { background: #4cc9f0; border-radius: 10px; }

      display: inline-block;

    .question-text {

      font-weight: 600;
      color: #e8e8f0;
      line-height: 1.5;

    }

      margin-top: 20px;
      font-size: 0.78rem;
      color: #555;
    }
    .answer-header {
      font-size: 0.8rem;
      color: #4cc9f0;

      margin-bottom: 14px;

      left: 16px;
      font-size: 0.75rem;
      color: #444;

    /* Navigation */

      align-items: center;
      justify-content: space-between;

      background: #16213e;

      font-size: 1rem;

    /* Mark buttons */
    .mark-area {
      max-width: 720px;
      margin: 0 auto 20px auto;
      display: flex;
      gap: 10px;

    .mark-btn {
      padding: 9px 22px;
      border-radius: 10px;
      border: 1.5px solid;

      font-size: 0.9rem;

    /* Keyboard hint */
    .keyboard-hint {
      text-align: center;
      color: #444;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

      background: #0f3460;
      border: 1px solid #1a4a80;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75rem;
      color: #888;
    }

<script>
const cards = [
  {
    id: 1, category: "Core Python",
    question: "What is the GIL (Global Interpreter Lock)?",
    answer: "The GIL is a mutex that protects access to Python objects, preventing multiple threads from executing Python bytecode simultaneously. It exists because CPython's memory management is not thread-safe.\n\nImpact: CPU-bound threads don't run truly in parallel.\n\nWorkarounds:\n• multiprocessing module (separate processes, each has own GIL)\n• C extensions that release GIL (NumPy does this)\n• async IO for IO-bound tasks\n• PyPy, Jython have different GIL behavior\n\nPython 3.12+ is working on making GIL optional (PEP 703 — free-threaded CPython)."
  },
  {
    id: 2, category: "Core Python",
    question: "What is the difference between a list and a tuple?",
    answer: "List: mutable, uses [], can be modified after creation. Supports append(), remove(), sort().\n\nTuple: immutable, uses (), cannot be modified after creation. Faster than lists. Can be used as dict keys (if all elements hashable).\n\nPerformance: tuples are faster to create and iterate.\nMemory: tuples use less memory than equivalent lists.\n\nUse tuples for: fixed data (coordinates, RGB, function return values), dict keys.\nUse lists for: collections that change, when order and mutability matter."
  },
  {
    id: 3, category: "Core Python",
    question: "What are Python decorators?",
    answer: "Decorators are functions that wrap other functions/methods to modify their behavior.\n\nSyntax: @decorator above a function definition.\nThey are syntactic sugar for: func = decorator(func)\n\nCommon built-in decorators:\n• @property — turns method into attribute\n• @staticmethod, @classmethod\n• @functools.lru_cache — memoization\n• @login_required (Django/Flask)\n\nFeatures:\n• Can be stacked (applied bottom-up)\n• Can accept arguments by adding another wrapper layer\n• Class-based decorators use __call__\n• functools.wraps preserves wrapped function metadata"
  },
  {
    id: 4, category: "OOP",
    question: "What is the difference between @staticmethod and @classmethod?",
    answer: "@staticmethod:\n• No implicit first argument\n• Doesn't access class or instance\n• Used for utility functions logically grouped in a class\n• Called on class or instance\n\n@classmethod:\n• Receives class (cls) as first argument\n• Can access/modify class state\n• Used for factory methods (alternative constructors)\n• cls allows subclasses to use it correctly (polymorphism)\n\nExample: DateTime.fromtimestamp() is a classmethod that creates DateTime objects.\n\nKey difference: @classmethod receives the class dynamically; @staticmethod is just a namespaced function."
  },
  {
    id: 5, category: "Core Python",
    question: "What are generators and when should you use them?",
    answer: "Generators are functions using 'yield' to produce values lazily. They return an iterator without storing all values in memory.\n\nUse when:\n• Processing large datasets (files, DB results)\n• Infinite sequences (Fibonacci, counters)\n• Pipeline data processing\n• Memory is constrained\n\nBenefits:\n• Memory efficient: O(1) vs O(n) for lists\n• Can represent infinite sequences\n• Lazy evaluation (compute only when needed)\n\nTypes:\n• Generator functions (use yield)\n• Generator expressions: (x*2 for x in range(100))\n\nAdvanced: send() passes values in, throw() raises exceptions inside generator."
  },
  {
    id: 6, category: "Core Python",
    question: "What is list/dict/set comprehension?",
    answer: "Comprehensions are concise ways to create collections.\n\nList: [expr for item in iterable if condition]\nDict: {k: v for k, v in items.items()}\nSet: {expr for item in iterable}\nGenerator: (expr for item in iterable)  # lazy!\n\nBenefits:\n• More readable than equivalent loops\n• Often faster (optimized internally)\n• Single expression\n\nNested: [[cell for cell in row] for row in matrix]\n(Avoid deep nesting — hurts readability)\n\nWalrus operator := can capture values mid-comprehension:\n[y := f(x), y**2]  # reuse computed value"
  },
  {
    id: 7, category: "Core Python",
    question: "What is the difference between 'is' and '=='?",
    answer: "== checks VALUE equality — calls __eq__ method.\n'is' checks IDENTITY — whether both variables refer to the exact same object in memory (compares id()).\n\nTrap: Small integers (-5 to 256) and short strings are interned by CPython, so 'is' may return True unexpectedly:\n  a = 256; b = 256; a is b  # True (interned)\n  a = 257; b = 257; a is b  # False (not interned)\n\nRules:\n• Always use == for value comparison\n• Use 'is' only for: None checks (if x is None), True/False, singleton sentinels\n• Never rely on string/integer interning behavior"
  },
  {
    id: 8, category: "Core Python",
    question: "What are *args and **kwargs?",
    answer: "*args collects extra positional arguments into a tuple.\n**kwargs collects extra keyword arguments into a dict.\n\nIn function definition:\n  def f(a, b, *args, **kwargs)\n\nIn function call (unpacking):\n  f(*my_list, **my_dict)\n\nOrder in signature:\n  normal params → *args → keyword-only params → **kwargs\n\nKeyword-only params (Python 3): def f(a, *, b)  # b must be keyword\n\nUse cases:\n• Flexible APIs (logging, formatting functions)\n• Decorator pass-through (preserve signature)\n• super() calls in cooperative inheritance"
  },
  {
    id: 9, category: "Core Python",
    question: "What is Python's memory management?",
    answer: "Primary: Reference counting — objects freed when refcount hits 0. Most objects are freed immediately.\n\nSecondary: Cyclic garbage collector handles circular references (gc module). Runs periodically. Can trigger manually: gc.collect().\n\nMemory pools: PyMalloc for small objects (<512 bytes) to avoid OS overhead. Objects allocated in arenas → pools → blocks.\n\nKey functions:\n• sys.getrefcount(obj) — shows refcount (+1 for arg)\n• id(obj) — returns memory address\n• del x — decrements refcount (may or may not free)\n\nWeak references (weakref module): reference without incrementing refcount. Useful for caches."
  },
  {
    id: 10, category: "Core Python",
    question: "What is duck typing?",
    answer: "'If it walks like a duck and quacks like a duck, it's a duck.'\n\nPython checks behavior (methods/attributes) not declared type. No explicit interface declaration needed.\n\nExample: any object with __iter__ and __next__ works as an iterator — no need to inherit from Iterator.\n\nEnables polymorphism without inheritance.\n\nEAFP style (Easier to Ask Forgiveness than Permission):\n  try:\n      result = obj.method()\n  except AttributeError:\n      handle_it()\n\nvs LBYL (Look Before You Leap): if hasattr(obj, 'method'):\n\nABCs provide formal duck typing contracts (collections.abc).\nUse isinstance() when type truly matters (security, serialization)."
  },
  {
    id: 11, category: "OOP",
    question: "What are Python's data model / magic methods?",
    answer: "Magic (dunder) methods customize object behavior with Python built-ins.\n\nLifecycle: __new__, __init__, __del__\nString repr: __str__ (user-facing), __repr__ (debug/eval)\nCollections: __len__, __getitem__, __setitem__, __delitem__, __contains__\nArithmetic: __add__, __sub__, __mul__, __truediv__, __floordiv__\nComparison: __eq__, __lt__, __le__, __gt__, __ge__, __hash__\nContext manager: __enter__, __exit__\nIteration: __iter__, __next__\nCallable: __call__\nAttribute access: __getattr__, __setattr__, __getattribute__\n\nImplementing them makes objects work seamlessly with:\nlen(), +, -, with, for, [], in, ==, sorted(), etc."
  },
  {
    id: 12, category: "OOP",
    question: "What is the MRO (Method Resolution Order)?",
    answer: "MRO determines the order Python searches classes for methods/attributes in inheritance hierarchies.\n\nPython 3 uses C3 Linearization algorithm (also called C3 superclass linearization).\n\nView it: ClassName.__mro__ or ClassName.mro()\n\nRule: left-to-right, depth-first, but maintains local precedence order and never repeats a class.\n\nExample:\n  class A: pass\n  class B(A): pass\n  class C(A): pass\n  class D(B, C): pass\n  D.mro() → [D, B, C, A, object]\n\nsuper() follows MRO automatically — critical for cooperative multiple inheritance.\nMRO prevents calling the same method twice in diamond inheritance."
  },
  {
    id: 13, category: "OOP",
    question: "What is multiple inheritance in Python?",
    answer: "Python allows a class to inherit from multiple parents:\n  class C(A, B): pass\n\nC3 MRO determines method lookup order.\n\nCooperative multiple inheritance:\n• All classes call super() in chain\n• super() passes the call along the MRO\n• Each class in hierarchy runs once\n\nMixin pattern: small focused classes providing specific functionality:\n  class LogMixin: ...\n  class SerializeMixin: ...\n  class MyModel(LogMixin, SerializeMixin, BaseModel): pass\n\nCommon issues:\n• Diamond problem — solved by MRO\n• Mixins should always call super()\n• Order of base classes matters (leftmost has priority)\n\nAvoid deep multiple inheritance hierarchies."
  },
  {
    id: 14, category: "Core Python",
    question: "What is a context manager?",
    answer: "Context managers define setup and teardown logic used with the 'with' statement.\n\nProtocol:\n• __enter__: runs at start, returns managed resource\n• __exit__(exc_type, exc_val, tb): cleanup, return True to suppress exceptions\n\nCommon uses:\n• File handling (auto-close)\n• Database connections and transactions\n• Thread locks\n• Temporary state changes\n\nCreating them:\n1. Class with __enter__/__exit__\n2. @contextlib.contextmanager decorator with yield:\n   @contextmanager\n   def managed():\n       setup()\n       try: yield resource\n       finally: cleanup()\n\ncontextlib utilities: suppress(), redirect_stdout(), ExitStack()"
  },
  {
    id: 15, category: "Async",
    question: "What is asyncio and how does it work?",
    answer: "asyncio is Python's async I/O framework using a single-threaded event loop with cooperative multitasking.\n\nHow it works:\n1. Event loop runs in one thread\n2. Coroutines run until they hit 'await'\n3. 'await' yields control back to event loop\n4. Event loop runs another ready coroutine\n5. When I/O completes, resumes original coroutine\n\nKey components:\n• Event loop: asyncio.get_event_loop()\n• Coroutines: async def functions\n• Tasks: asyncio.create_task() — concurrent scheduling\n• Futures: low-level result containers\n\nEntry point: asyncio.run(main())\n\nBest for: I/O-bound concurrent tasks (HTTP, DB, files).\nNot for: CPU-bound (use multiprocessing instead)."
  },
  {
    id: 16, category: "Async",
    question: "What are coroutines?",
    answer: "Coroutines are special functions defined with 'async def' that can be paused (at await points) and resumed.\n\nKey facts:\n• Calling a coroutine function returns a coroutine OBJECT (doesn't execute it)\n• Must be awaited, or wrapped in a Task\n• Use 'await' to pause and yield control\n\nRunning coroutines:\n• await coro — waits for one\n• asyncio.create_task(coro) — schedules concurrently\n• asyncio.gather(*coros) — run many, wait for all\n\nExample:\n  async def fetch(url):\n      async with aiohttp.ClientSession() as s:\n          resp = await s.get(url)\n          return await resp.text()\n\nDifference from generators: coroutines use send/yield internally but are designed for async I/O, not data production."
  },
  {
    id: 17, category: "Async",
    question: "What is the difference between async/await and threads?",
    answer: "Async/await:\n• Single-threaded, cooperative multitasking\n• Explicit yield points (await)\n• No race conditions on Python objects\n• Very low overhead (no OS thread switch)\n• Great for I/O-bound concurrent tasks\n• Requires async-compatible libraries\n\nThreads:\n• OS-managed, preemptive switching\n• GIL limits true CPU parallelism for Python code\n• Can have race conditions (need locks)\n• Good for blocking I/O when async not available\n• Works with existing synchronous libraries\n\nMultiprocessing: True CPU parallelism (separate GIL per process)\n\nGuideline:\n• New I/O-bound code → async/await\n• Legacy blocking code → threads\n• CPU-bound computation → multiprocessing"
  },
  {
    id: 18, category: "Functional",
    question: "What is a closure?",
    answer: "A closure is a function that captures (closes over) variables from its enclosing scope (free variables). These captured variables persist even after the outer function returns.\n\nRequirements:\n1. Nested function\n2. Inner function references outer variable\n3. Outer function returns inner function\n\nExample:\n  def make_counter(start=0):\n      count = [start]  # mutable container trick\n      def counter():\n          count[0] += 1\n          return count[0]\n      return counter\n\n'nonlocal' keyword modifies captured variables directly.\n\nCell objects store captured variables (func.__closure__).\n\nClosures are the mechanism behind:\n• Decorators\n• Function factories\n• Callbacks with state\n• Partial application"
  },
  {
    id: 19, category: "Functional",
    question: "What are first-class functions?",
    answer: "In Python, functions are first-class objects — they can be:\n• Assigned to variables: f = print\n• Passed as arguments: sorted(list, key=func)\n• Returned from functions: return inner_func\n• Stored in data structures: ops = [add, sub, mul]\n\nThis enables:\n• Higher-order functions (map, filter, sorted, reduce)\n• Decorators\n• Callbacks and event handlers\n• Functional programming patterns\n\nFunction attributes:\n• func.__name__ — function name\n• func.__doc__ — docstring\n• func.__annotations__ — type hints dict\n• func.__defaults__ — default argument values\n• func.__code__ — code object\n\nfunctools module provides utilities for working with functions as first-class objects."

// State
let currentIndex = 0;
let isFlipped = false;
let activeCategory = 'All';
let marks = {}; // id -> 'know' | 'review' | 'hard'
let reviewed = new Set();

function getFilteredCards() {
  if (activeCategory === 'All') return cards;
  const catMap = {
    'Core Python': 'Core Python',
    'OOP': 'OOP',
    'Data Structures': 'Data Structures',
    'Functional': 'Functional',
    'Async': 'Async'
  };
  return cards.filter(c => c.category === catMap[activeCategory]);
}

function getCategoryBadgeClass(cat) {
  if (cat === 'Core Python') return 'badge-Core';
  if (cat === 'OOP') return 'badge-OOP';
  if (cat === 'Data Structures') return 'badge-Data';
  if (cat === 'Functional') return 'badge-Functional';
  if (cat === 'Async') return 'badge-Async';
  return 'badge-Core';
}

function renderCard() {
  const filtered = getFilteredCards();
  if (filtered.length === 0) return;

  const card = filtered[currentIndex];
  const mark = marks[card.id];

  // Front
  document.getElementById('front-num').textContent = `#${card.id}`;
  const frontCat = document.getElementById('front-cat');
  frontCat.textContent = card.category;
  frontCat.className = 'category-badge ' + getCategoryBadgeClass(card.category);
  document.getElementById('question-text').textContent = card.question;

  // Back
  document.getElementById('back-num').textContent = `#${card.id}`;
  document.getElementById('answer-text').textContent = card.answer;

  // Mark badges
  const frontBadge = document.getElementById('front-mark-badge');
  const backBadge = document.getElementById('back-mark-badge');
  if (mark) {
    const badgeClass = mark === 'know' ? 'mark-badge-know' : mark === 'review' ? 'mark-badge-review' : 'mark-badge-hard';
    const badgeText = mark === 'know' ? 'Know it ✓' : mark === 'review' ? 'Review ↺' : 'Hard !';
    frontBadge.className = 'mark-badge ' + badgeClass;
    frontBadge.textContent = badgeText;
    backBadge.className = 'mark-badge ' + badgeClass;
    backBadge.textContent = badgeText;
  } else {
    frontBadge.className = '';
    frontBadge.textContent = '';
    backBadge.className = '';
    backBadge.textContent = '';
  }

  // Counter
  document.getElementById('card-counter').textContent = `${currentIndex + 1} / ${filtered.length}`;

  // Nav buttons
  document.getElementById('prev-btn').disabled = currentIndex === 0;
  document.getElementById('next-btn').disabled = currentIndex === filtered.length - 1;

  // Mark buttons
  ['know', 'review', 'hard'].forEach(m => {
    document.getElementById('btn-' + m).classList.toggle('active', marks[card.id] === m);
  });

  // Reset flip state
  isFlipped = false;
  document.getElementById('card-inner').classList.remove('flipped');

  // Mark as reviewed
  reviewed.add(card.id);
  updateProgress();
}

function updateProgress() {
  document.getElementById('reviewed-count').textContent = reviewed.size;
  let knowCount = 0, reviewCount = 0, hardCount = 0;
  Object.values(marks).forEach(m => {
    if (m === 'know') knowCount++;
    else if (m === 'review') reviewCount++;
    else if (m === 'hard') hardCount++;
  });
  document.getElementById('count-know').textContent = knowCount;
  document.getElementById('count-review').textContent = reviewCount;
  document.getElementById('count-hard').textContent = hardCount;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card-inner').classList.toggle('flipped', isFlipped);
}

function navigate(dir) {
  const filtered = getFilteredCards();
  const newIndex = currentIndex + dir;
  if (newIndex >= 0 && newIndex < filtered.length) {
    currentIndex = newIndex;
    renderCard();
  }
}

function markCard(mark) {
  const filtered = getFilteredCards();
  const card = filtered[currentIndex];
  if (marks[card.id] === mark) {
    delete marks[card.id];
  } else {
    marks[card.id] = mark;
  }
  renderCard();
}

function filterByCategory(cat) {
  activeCategory = cat;
  currentIndex = 0;
  isFlipped = false;

  // Update button styles
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.cat === cat) btn.classList.add('active');
  });

  renderCard();
}

// Event listeners
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => filterByCategory(btn.dataset.cat));
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') { e.preventDefault(); navigate(-1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); navigate(1); }
  else if (e.code === 'Space') { e.preventDefault(); flipCard(); }
});

// Init
renderCard();
document.getElementById('total-count').textContent = cards.length;
</script>
